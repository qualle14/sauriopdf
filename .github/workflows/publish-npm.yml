name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # required for npm's OIDC trusted publishing (no token needed)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1; setup-node's bundled npm may be older.
      - name: Update npm for trusted publishing support
        run: npm install -g npm@latest

      - name: Install dev dependencies
        run: npm install --ignore-scripts

      - name: Run tests
        run: deno test --allow-read --allow-write main_test.ts pool_test.ts

      - name: Build TypeScript + copy WASM + copy fonts
        run: npm run build:ts

      - name: Publish to npm
        run: npm publish --access public --ignore-scripts
