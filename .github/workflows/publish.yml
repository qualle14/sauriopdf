name: Publish to JSR

on:
  push:
    tags:
      - "v*"   # triggers on: git tag v0.1.0 && git push --tags

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for JSR's OIDC auth (no token needed)

    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify types
        run: deno check mod.ts

      - name: Run tests
        run: deno test --allow-read --allow-write main_test.ts

      - name: Publish to JSR
        run: deno publish
