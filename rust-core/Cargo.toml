[package]
name = "sauriopdf-core"
version = "0.3.0"
edition = "2021"
authors = ["Qualle14"]
description = "High-performance PDF generator using Krilla, compiled to WASM"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# PDF Generation with Krilla
krilla = "0.8"

# WASM Bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

# Image support
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Real glyph advance widths for text wrapping (hmtx/hhea tables) — already in the
# dependency tree transitively via Krilla's font stack; pinned directly so our own
# code can use it too.
ttf-parser = "0.25"

# Error handling
thiserror = "2.0"

# JavaScript interop
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Blob", "BlobPropertyBag"] }

# Base64 encoding/decoding
base64 = "0.22"

# Better error messages in WASM
console_error_panic_hook = { version = "0.1", optional = true }

# Optional: Math rendering
# We'll handle KaTeX rendering on the TS side and pass rendered glyphs

[features]
default = ["console_error_panic_hook"]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Better optimization
strip = true        # Strip symbols
panic = "abort"     # Smaller binary

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-mutable-globals"]
